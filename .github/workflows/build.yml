# Every time code is pushed to GitHub, this builds the project and runs all the tests
# on a fresh machine. The green tick (or red cross) next to each commit comes from here.
name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run the tests
        run: mvn -B verify

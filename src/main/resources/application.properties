# --- The app ---
spring.application.name=fraud-detection-service
server.port=8080

# --- The database ---
# H2 runs inside the app and keeps everything in memory, so there's nothing to install.
# The catch: all data disappears when the app stops. To use a real database such as
# PostgreSQL, change these three lines and add its driver to pom.xml.
spring.datasource.url=jdbc:h2:mem:frauddb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Create the tables from our @Entity classes on startup, and drop them on shutdown.
spring.jpa.hibernate.ddl-auto=create-drop
# Close the database session when each request's service call finishes. This is the
# safer setting and stops Spring printing a warning about it on startup.
spring.jpa.open-in-view=false

# A web page for poking around the database: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:frauddb   User: sa   Password: (leave empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Our own settings ---
# How many synthetic customers to train the model on, and the random seed.
fraud.training.customers=1000
fraud.training.seed=42

# Fill the database with demo payments on startup.
fraud.demo-data.enabled=true
fraud.demo-data.customers=40
